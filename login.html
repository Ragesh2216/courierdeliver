<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Access - Stackly Cargo & Logistics</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .auth-alert {
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.3s ease;
    }
    .auth-alert-success {
      background: #d1e7dd;
      color: #0f5132;
      border: 1px solid #badbcc;
    }
    .auth-alert-error {
      background: #f8d7da;
      color: #842029;
      border: 1px solid #f5c2c7;
    }
  </style>
</head>
<body class="login-page-body">

  <div class="login-card-container">
    <!-- Left Hero Image Column -->
    <div class="login-left-hero" id="loginLeftHero" style="background-image: url('images/login_hero.webp');">
      <a href="index.html" class="hero-back-link" style="position: absolute; top: 1.5rem; left: 1.5rem; z-index: 5; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.4rem; background: rgba(0,0,0,0.35); padding: 0.45rem 0.9rem; border-radius: 20px; backdrop-filter: blur(4px); transition: background 0.2s;">
        <i class="fa-solid fa-arrow-left"></i> Back
      </a>
      <div class="login-left-overlay"></div>
      <div class="login-left-content">
        <div class="login-hero-icons">
          <i class="fa-solid fa-box"></i>
          <i class="fa-solid fa-shield-halved"></i>
          <i class="fa-solid fa-route"></i>
        </div>
        <div class="login-hero-tag">MOVING WHAT MATTERS</div>
        <h2 class="login-hero-title">Every journey starts somewhere.</h2>
      </div>
    </div>

    <!-- Right Form Column -->
    <div class="login-right-form">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.75rem;">
        <a href="index.html">
          <img src="logo_0970.webp" alt="Stackly Logistics" style="height: 40px;">
        </a>
      </div>

      <div id="authAlert" class="auth-alert" style="display: none;"></div>

      <div class="login-header-meta">STACKLY / YOUR ACCOUNT</div>
      <h1 class="login-title" id="loginTitle">Welcome back.</h1>
      <p class="login-subtitle" id="loginSubtitle">Sign in to continue with Stackly.</p>

      <form id="authForm">
        <!-- Role Selector -->
        <div class="role-selector-group">
          <label class="role-label">Select Account Role:</label>
          <div class="role-tabs">
            <button type="button" class="role-tab-btn active" data-role="user" id="roleUserBtn">
              <i class="fa-solid fa-user"></i> Client Portal
            </button>
            <button type="button" class="role-tab-btn" data-role="admin" id="roleAdminBtn">
              <i class="fa-solid fa-user-shield"></i> Admin Dispatch
            </button>
          </div>
        </div>

        <!-- Additional Create Account Details Fields (Hidden in Signin Mode) -->
        <div id="signupOnlyFields" style="display: none;">
          <div class="form-group" style="margin-bottom: 0;">
            <label style="font-weight: 700; font-size: 0.825rem; margin-bottom: 0.35rem; display: block;">Full Name</label>
            <div class="input-with-icon">
              <i class="fa-regular fa-user"></i>
              <input type="text" id="fullnameInput" placeholder="John Doe">
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label style="font-weight: 700; font-size: 0.825rem; margin-bottom: 0.35rem; display: block;">Phone Number</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-phone"></i>
              <input type="tel" id="phoneInput" placeholder="+1 (555) 019-2834">
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label style="font-weight: 700; font-size: 0.825rem; margin-bottom: 0.35rem; display: block;">Company / Organization (Optional)</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-building"></i>
              <input type="text" id="companyInput" placeholder="Acme Freight Ltd.">
            </div>
          </div>
        </div>

        <!-- Email Field -->
        <div class="form-group" style="margin-bottom: 0;">
          <label style="font-weight: 700; font-size: 0.825rem; margin-bottom: 0.35rem; display: block;">Email address</label>
          <div class="input-with-icon">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="emailInput" placeholder="you@example.com" required>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group" style="margin-bottom: 0;">
          <label style="font-weight: 700; font-size: 0.825rem; margin-bottom: 0.35rem; display: block;">Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="passwordInput" placeholder="Enter your password" required>
            <i class="fa-regular fa-eye toggle-password-btn" id="togglePasswordBtn" title="Show/Hide password"></i>
          </div>
        </div>

        <!-- Confirm Password Field (Hidden in Signin Mode) -->
        <div id="confirmPasswordGroup" style="display: none;">
          <div class="form-group" style="margin-bottom: 0;">
            <label style="font-weight: 700; font-size: 0.825rem; margin-bottom: 0.35rem; display: block;">Confirm Password</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="confirmPasswordInput" placeholder="Re-enter your password">
              <i class="fa-regular fa-eye toggle-password-btn" id="toggleConfirmPasswordBtn" title="Show/Hide password"></i>
            </div>
          </div>

          <!-- Terms and Conditions Checkbox -->
          <div class="form-group" id="termsGroup" style="margin-top: 0.85rem; margin-bottom: 1.25rem;">
            <label style="display: flex; align-items: flex-start; gap: 0.6rem; font-size: 0.85rem; color: var(--color-muted-text); cursor: pointer; line-height: 1.4;">
              <input type="checkbox" id="termsCheckbox" style="margin-top: 0.15rem; accent-color: var(--color-dark-bg); width: 16px; height: 16px; cursor: pointer; flex-shrink: 0;">
              <span>I agree to the <a href="404.html" id="termsLink" style="color: var(--color-dark-text); font-weight: 700; text-decoration: underline;">Terms and Conditions</a> &amp; <a href="404.html" id="privacyLink" style="color: var(--color-dark-text); font-weight: 700; text-decoration: underline;">Privacy Policy</a></span>
            </label>
          </div>
        </div>

        <a href="javascript:void(0)" class="forgot-pass-link" id="forgotPassLink">Forgot password?</a>

        <button type="submit" class="btn-login-submit" id="submitAuthBtn">Sign in <i class="fa-solid fa-arrow-right"></i></button>

        <div class="login-divider">or</div>

        <button type="button" class="btn-google-auth" id="googleAuthBtn">
          <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google" width="18">
          Continue with Google
        </button>

        <div class="toggle-auth-text" id="toggleAuthWrapper">
          New to Stackly? <a href="javascript:void(0)" id="toggleAuthBtn">Create an account</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentMode = 'signin';
    let selectedRole = 'user';

    const leftHero = document.getElementById('loginLeftHero');
    const loginTitle = document.getElementById('loginTitle');
    const loginSubtitle = document.getElementById('loginSubtitle');
    const submitBtn = document.getElementById('submitAuthBtn');
    const forgotLink = document.getElementById('forgotPassLink');
    const toggleWrapper = document.getElementById('toggleAuthWrapper');
    const roleUserBtn = document.getElementById('roleUserBtn');
    const roleAdminBtn = document.getElementById('roleAdminBtn');
    const authForm = document.getElementById('authForm');
    const googleAuthBtn = document.getElementById('googleAuthBtn');

    const signupOnlyFields = document.getElementById('signupOnlyFields');
    const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
    const fullnameInput = document.getElementById('fullnameInput');
    const phoneInput = document.getElementById('phoneInput');
    const passwordInput = document.getElementById('passwordInput');
    const confirmPasswordInput = document.getElementById('confirmPasswordInput');
    const termsCheckbox = document.getElementById('termsCheckbox');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const toggleConfirmPasswordBtn = document.getElementById('toggleConfirmPasswordBtn');
    const authAlert = document.getElementById('authAlert');

    function showAlert(msg, type = 'success') {
      authAlert.className = `auth-alert auth-alert-${type}`;
      authAlert.innerHTML = type === 'success' 
        ? `<i class="fa-solid fa-circle-check"></i> ${msg}`
        : `<i class="fa-solid fa-circle-exclamation"></i> ${msg}`;
      authAlert.style.display = 'flex';
    }

    function hideAlert() {
      authAlert.style.display = 'none';
    }

    // Toggle password visibility
    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePasswordBtn.classList.toggle('fa-eye', !isPassword);
        togglePasswordBtn.classList.toggle('fa-eye-slash', isPassword);
      });
    }

    // Toggle confirm password visibility
    if (toggleConfirmPasswordBtn && confirmPasswordInput) {
      toggleConfirmPasswordBtn.addEventListener('click', () => {
        const isPassword = confirmPasswordInput.type === 'password';
        confirmPasswordInput.type = isPassword ? 'text' : 'password';
        toggleConfirmPasswordBtn.classList.toggle('fa-eye', !isPassword);
        toggleConfirmPasswordBtn.classList.toggle('fa-eye-slash', isPassword);
      });
    }

    function setFormMode(mode) {
      currentMode = mode;
      hideAlert();

      if (mode === 'signup') {
        leftHero.style.backgroundImage = "url('images/login_signup_hero.webp')";
        loginTitle.textContent = "Join the journey.";
        loginSubtitle.textContent = "Create an account to stay connected.";
        submitBtn.innerHTML = 'Create account <i class="fa-solid fa-arrow-right"></i>';
        forgotLink.style.display = "none";
        signupOnlyFields.style.display = "block";
        confirmPasswordGroup.style.display = "block";

        fullnameInput.required = true;
        phoneInput.required = true;
        confirmPasswordInput.required = true;
        if (termsCheckbox) termsCheckbox.required = true;

        toggleWrapper.innerHTML = 'Already have an account? <a href="javascript:void(0)" id="toggleAuthBtn">Sign in</a>';
      } else {
        leftHero.style.backgroundImage = "url('images/login_hero.webp')";
        loginTitle.textContent = "Welcome back.";
        loginSubtitle.textContent = "Sign in to continue with Stackly.";
        submitBtn.innerHTML = 'Sign in <i class="fa-solid fa-arrow-right"></i>';
        forgotLink.style.display = "block";
        signupOnlyFields.style.display = "none";
        confirmPasswordGroup.style.display = "none";

        fullnameInput.required = false;
        phoneInput.required = false;
        confirmPasswordInput.required = false;
        if (termsCheckbox) {
          termsCheckbox.required = false;
          termsCheckbox.checked = false;
        }

        toggleWrapper.innerHTML = 'New to Stackly? <a href="javascript:void(0)" id="toggleAuthBtn">Create an account</a>';
      }
    }

    // Role selection handler
    roleUserBtn.addEventListener('click', () => {
      selectedRole = 'user';
      roleUserBtn.classList.add('active');
      roleAdminBtn.classList.remove('active');
    });

    roleAdminBtn.addEventListener('click', () => {
      selectedRole = 'admin';
      roleAdminBtn.classList.add('active');
      roleUserBtn.classList.remove('active');
    });

    // Toggle event delegation
    toggleWrapper.addEventListener('click', (e) => {
      if (e.target && e.target.id === 'toggleAuthBtn') {
        if (currentMode === 'signin') {
          setFormMode('signup');
        } else {
          setFormMode('signin');
        }
      }
    });

    // Form submit -> Store details & Route
    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const enteredEmail = document.getElementById('emailInput')?.value || 'user@stackly.com';
      const passwordVal = document.getElementById('passwordInput')?.value || '';

      if (currentMode === 'signup') {
        const confirmVal = confirmPasswordInput.value;
        if (passwordVal !== confirmVal) {
          showAlert("Passwords do not match. Please try again.", "error");
          confirmPasswordInput.focus();
          return;
        }

        if (termsCheckbox && !termsCheckbox.checked) {
          showAlert("Please accept the Terms and Conditions to create an account.", "error");
          termsCheckbox.focus();
          return;
        }

        // Save new user details in localStorage
        try {
          localStorage.setItem('stackly_user_fullname', fullnameInput.value.trim());
          localStorage.setItem('stackly_user_phone', phoneInput.value.trim());
          localStorage.setItem('stackly_user_company', document.getElementById('companyInput')?.value.trim() || '');
          localStorage.setItem('stackly_user_email', enteredEmail.trim());
          localStorage.setItem('stackly_user_role', selectedRole);
        } catch (err) {}

        // Clear password fields & reset terms
        document.getElementById('passwordInput').value = '';
        confirmPasswordInput.value = '';
        if (termsCheckbox) termsCheckbox.checked = false;

        // Switch back to login page mode
        setFormMode('signin');

        // Pre-fill email and show success message
        document.getElementById('emailInput').value = enteredEmail;
        showAlert("Account created successfully! Please sign in with your password.", "success");
        document.getElementById('passwordInput').focus();

      } else {
        // Sign In mode
        try {
          localStorage.setItem('stackly_user_email', enteredEmail.trim());
          localStorage.setItem('stackly_user_role', selectedRole);
        } catch (err) {}

        if (selectedRole === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'user.html';
        }
      }
    });

    googleAuthBtn.addEventListener('click', () => {
      window.location.href = '404.html';
    });

    // Terms & Conditions and Privacy Policy 404 navigation handlers
    const termsLink = document.getElementById('termsLink');
    const privacyLink = document.getElementById('privacyLink');

    if (termsLink) {
      termsLink.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = '404.html';
      });
    }

    if (privacyLink) {
      privacyLink.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = '404.html';
      });
    }

    // Forgot Password Handler
    if (forgotLink) {
      forgotLink.addEventListener('click', (e) => {
        e.preventDefault();
        const emailInput = document.getElementById('emailInput');
        const emailVal = emailInput ? emailInput.value.trim() : '';
        if (emailVal) {
          showAlert(`Password reset instructions sent to ${emailVal}.`, "success");
        } else {
          showAlert("Please enter your email address to receive password reset instructions.", "error");
          if (emailInput) emailInput.focus();
        }
      });
    }
  </script>
</body>
</html>
